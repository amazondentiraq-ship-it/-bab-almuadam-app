  <title>تطبيق باب المعظم</title>

  <style>
    * {

    body {
      margin: 0;

      background: linear-gradient(160deg, #081a33, #12345b, #071522);

      font-weight: bold;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      line-height: 1.8;
    }

    .button {
      display: block;
      margin: 12px 0;
      padding: 15px;
      border-radius: 15px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .store {
      background: white;
      color: #071522;
    }

    .contact {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
